<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cooper Air CRM</title>
<meta name="description" content="Demo: a custom CRM for a home-service company, with a drag-and-drop pipeline, built-in follow-up automations and a full history on every customer.">
<link rel="stylesheet" href="../assets/base.css">
<style>
/* Layout: sidebar nav, pipeline board, customer panel that slides over on the right. */
:root { --accent: #0f766e; --accent-soft: #dcf0ed; --col: #e9ecef; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #4cc2b4; --accent-soft: #15302d; --accent-ink: #062320; --col: #15181b; } }
:root[data-theme="dark"] { --accent: #4cc2b4; --accent-soft: #15302d; --accent-ink: #062320; --col: #15181b; }

.shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: calc(100vh - 32px); }
.nav { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav .co { display: flex; gap: 9px; align-items: center; padding: 4px 8px 14px; font-weight: 700; }
.nav .co i { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-style: normal; font-size: 12px; }
.nav a { text-decoration: none; padding: 7px 10px; border-radius: var(--r-sm); color: var(--ink-2); display: flex; justify-content: space-between; }
.nav a[aria-current="page"] { background: var(--sunken); color: var(--ink); font-weight: 600; }
.nav a span { color: var(--ink-3); font-size: 12px; }
.nav .foot { margin-top: auto; font-size: 12px; color: var(--ink-3); padding: 10px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
.bar h1 { margin: 0; font-size: 16px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters select { height: 30px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); padding: 0 8px; }
.filters .input { width: 200px; height: 30px; }

.board { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; padding: 14px 18px 24px; overflow-x: auto; align-items: start; }
.col { background: var(--col); border-radius: var(--r-lg); padding: 8px; min-height: 200px; display: flex; flex-direction: column; gap: 8px; }
.col.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col header { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 6px 2px; }
.col header b { font-size: 13px; }
.col header span { font-size: 12px; color: var(--ink-3); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px; display: grid; gap: 6px; cursor: grab; text-align: left; width: 100%; }
.card:hover { border-color: var(--line-strong); }
.card.dragging { opacity: .5; }
.card .r1 { display: flex; justify-content: space-between; gap: 8px; }
.card b { font-size: 13.5px; }
.card .val { font-weight: 600; font-size: 13px; }
.card .meta { font-size: 12px; color: var(--ink-3); }
.card .tags { display: flex; gap: 4px; flex-wrap: wrap; }
.card .due { font-size: 12px; white-space: nowrap; }
.nav .foot a { display: inline; padding: 0; color: var(--accent); text-decoration: underline; }
.card .due.late { color: var(--bad); }
.av { width: 22px; height: 22px; border-radius: 50%; background: var(--sunken); color: var(--ink-2); font-size: 10.5px; font-weight: 700; display: inline-grid; place-items: center; flex: none; }

.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(0,0,0,.14); z-index: 40; overflow: auto; padding-top: env(safe-area-inset-top, 0px); }
.panel header { position: sticky; top: 0; background: var(--surface); display: flex; justify-content: space-between; align-items: start; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.panel h2 { margin: 0; font-size: 18px; }
.panel .sec { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.panel h3 { margin: 0 0 8px; font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.kv { display: grid; grid-template-columns: 100px 1fr; gap: 6px 10px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.tl li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; font-size: 13px; }
.tl li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); margin-top: 5px; }
.tl li.auto::before { background: var(--accent); }
.tl small { display: block; color: var(--ink-3); font-size: 12px; }
.note { display: flex; gap: 8px; margin-top: 10px; }
.draft { margin-top: 10px; padding: 10px; border-radius: var(--r-md); background: var(--sunken); font-size: 13px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: var(--r-md); font-size: 13px; z-index: 60; max-width: calc(100vw - 32px); }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
  .nav .co { padding: 4px 8px; } .nav .foot { display: none; }
  .filters .input { width: 100%; }
  .board { grid-auto-columns: minmax(240px, 82vw); }
}
</style>
</head>
<body>
<div class="demo-bar"><span>Demo build by Arav Bazar. Cooper Air is a fictional HVAC company and every customer here is sample data.</span><a href="../">See all projects</a></div>
<div class="shell">
  <nav class="nav" aria-label="CRM">
    <div class="co"><i aria-hidden="true">CA</i>Cooper Air</div>
    <a href="#" aria-current="page">Pipeline <span id="navCount"></span></a>
    <a href="#">Customers <span>1,284</span></a>
    <a href="#">Schedule <span>14 today</span></a>
    <a href="#">Automations <span>6 on</span></a>
    <a href="#">Reports</a>
    <div class="foot">Leads arrive from the <a href="../speed-to-lead/">lead pipeline</a> already scored.</div>
  </nav>
  <div class="main">
    <div class="bar">
      <h1>Pipeline <span class="muted" id="pipeTotal" style="font-weight:400;font-size:13px"></span></h1>
      <div class="filters">
        <label class="sr" for="q">Search</label><input class="input" id="q" placeholder="Search name, ZIP or job">
        <label class="sr" for="fTech">Technician</label><select id="fTech"><option value="">All technicians</option><option>Marco</option><option>Dana</option><option>Luis</option></select>
        <label class="sr" for="fSrc">Source</label><select id="fSrc"><option value="">All sources</option><option>Google LSA</option><option>Website</option><option>Facebook</option><option>Referral</option><option>Angi</option></select>
      </div>
    </div>
    <div class="board" id="board"></div>
  </div>
</div>
<aside class="panel" id="panel" hidden aria-label="Customer"></aside>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
  const STAGES = [
    { id: "new", name: "New lead", auto: "Texted within 60 seconds by the lead pipeline" },
    { id: "contacted", name: "Contacted", auto: "Call task created for the assigned tech" },
    { id: "visit", name: "Visit booked", auto: "Reminder text sent the evening before" },
    { id: "quote", name: "Quote sent", auto: "Follow-up text scheduled in 2 days if no reply" },
    { id: "won", name: "Won", auto: "Review request sent 24 hours after the job" },
    { id: "lost", name: "Lost", auto: "Added to the spring tune-up campaign" }
  ];
  const D = (days, h = 10) => { const d = new Date(); d.setDate(d.getDate() + days); d.setHours(h, 0, 0, 0); return d; };
  let DEALS = [
    { id: 1, name: "Tasha Greene", job: "AC not cooling", value: 480, stage: "new", tech: "Marco", src: "Google LSA", zip: "78664", phone: "(512) 555-0161", score: 90, due: D(0, 15), hist: [["auto", "Lead came in from Google Local Services, scored 90", -0.02], ["auto", "Text sent: tech available today 12 to 2pm or 3 to 5pm", -0.02]] },
    { id: 2, name: "Ben Ortiz", job: "Furnace tune-up", value: 129, stage: "new", tech: "Dana", src: "Website", zip: "78626", phone: "(737) 555-0122", score: 40, due: D(1), hist: [["auto", "Lead came in from the website form, scored 40", -0.1]] },
    { id: 3, name: "Keisha Lowe", job: "AC repair, capacitor", value: 365, stage: "contacted", tech: "Marco", src: "Google LSA", zip: "78634", phone: "(512) 555-0112", score: 80, due: D(0, 13), hist: [["auto", "Text sent within 9 seconds", -0.2], ["user", "Marco called, confirmed AC blowing warm", -0.18]] },
    { id: 4, name: "Sam Whitaker", job: "System replacement, 3.5 ton", value: 11800, stage: "visit", tech: "Luis", src: "Angi", zip: "78729", phone: "(512) 555-0139", score: 65, due: D(1, 9), hist: [["auto", "Lead came in from Angi, scored 65", -2], ["user", "Luis booked an in-home estimate", -1.5], ["auto", "Reminder text scheduled for tonight", -1.5]] },
    { id: 5, name: "Anita Brooks", job: "Heat pump install", value: 14200, stage: "quote", tech: "Luis", src: "Facebook", zip: "78660", phone: "(512) 555-0174", score: 70, due: D(-1), hist: [["user", "Estimate visit done, measured for 4 ton heat pump", -6], ["user", "Quote sent: Good $11,900, Better $14,200, Best $17,600", -4], ["auto", "Follow-up text sent: any questions on the quote?", -2]] },
    { id: 6, name: "Lauren Pike", job: "New system quote", value: 9600, stage: "quote", tech: "Dana", src: "Facebook", zip: "78613", phone: "(512) 555-0133", score: 55, due: D(2), hist: [["user", "Quote sent", -9], ["auto", "Lead came in again from Facebook, merged into this deal", -0.1]] },
    { id: 7, name: "Gloria Vance", job: "No heat, igniter", value: 290, stage: "won", tech: "Marco", src: "Google LSA", zip: "78681", phone: "(512) 555-0147", score: 90, due: null, hist: [["auto", "Text sent within 9 seconds", -0.3], ["user", "Replaced hot surface igniter, heat restored", -0.25], ["auto", "Review request scheduled for tomorrow", -0.25]] },
    { id: 8, name: "Ray Dominguez", job: "Duct cleaning", value: 450, stage: "won", tech: "Dana", src: "Referral", zip: "78665", phone: "(512) 555-0185", score: 50, due: null, hist: [["user", "Job complete", -3], ["auto", "Review request sent; left 5 stars", -2]] },
    { id: 9, name: "Hannah Cole", job: "Mini-split install", value: 5400, stage: "lost", tech: "Luis", src: "Website", zip: "78641", phone: "(737) 555-0104", score: 45, due: null, lost: "Went with a cheaper quote", hist: [["user", "Customer chose another company on price", -5], ["auto", "Added to the spring tune-up campaign", -5]] },
    { id: 10, name: "Omar Haddad", job: "Thermostat upgrade", value: 340, stage: "contacted", tech: "Dana", src: "Website", zip: "78750", phone: "(512) 555-0169", score: 35, due: D(-2), hist: [["auto", "Text sent within 21 seconds", -3], ["user", "Left voicemail", -2]] }
  ];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = n => "$" + n.toLocaleString();
  const ago = d => { const n = Math.round(-d * 24); if (n < 1) return "Just now"; if (n < 24) return n + "h ago"; return Math.round(-d) + "d ago"; };
  const dueTxt = d => { if (!d) return ""; const t = new Date(); t.setHours(0,0,0,0); const dd = new Date(d); dd.setHours(0,0,0,0); const n = Math.round((dd - t) / 864e5); return n < 0 ? (-n) + "d overdue" : n === 0 ? "Today " + d.toLocaleTimeString([], { hour: "numeric" }) : n === 1 ? "Tomorrow" : "In " + n + " days"; };
  const initials = n => n.split(" ").map(x => x[0]).join("").slice(0, 2);
  let open = null;

  function filtered() {
    const q = $("q").value.trim().toLowerCase(), t = $("fTech").value, s = $("fSrc").value;
    return DEALS.filter(d => (!q || (d.name + " " + d.job + " " + d.zip).toLowerCase().includes(q)) && (!t || d.tech === t) && (!s || d.src === s));
  }
  function render() {
    const list = filtered();
    const openDeals = list.filter(d => !["won", "lost"].includes(d.stage));
    $("pipeTotal").textContent = money(openDeals.reduce((a, d) => a + d.value, 0)) + " open across " + openDeals.length + " deals";
    $("navCount").textContent = openDeals.length;
    $("board").innerHTML = STAGES.map(st => {
      const ds = list.filter(d => d.stage === st.id);
      return `<section class="col" data-stage="${st.id}" aria-label="${st.name}"><header><b>${st.name} <span>${ds.length}</span></b><span>${money(ds.reduce((a, d) => a + d.value, 0))}</span></header>
        ${ds.map(d => `<button class="card" draggable="true" data-id="${d.id}" type="button">
          <div class="r1"><b>${esc(d.name)}</b><span class="val">${money(d.value)}</span></div>
          <span class="meta">${esc(d.job)}, ${esc(d.zip)}</span>
          <div class="r1"><span class="tags"><span class="pill">${esc(d.src)}</span>${d.score >= 70 && !["won", "lost"].includes(d.stage) ? '<span class="pill bad">Hot</span>' : ""}</span>
          <span style="display:flex;gap:6px;align-items:center">${d.due ? `<span class="due ${d.due < new Date() && dueTxt(d.due).includes("overdue") ? "late" : ""}">${dueTxt(d.due)}</span>` : ""}<span class="av" title="${d.tech}">${initials(d.tech)}</span></span></div>
        </button>`).join("")}</section>`;
    }).join("");
  }
  function toast(msg) { $("toast").textContent = msg; $("toast").hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").hidden = true, 2600); }
  function move(id, stage) {
    const d = DEALS.find(x => x.id === id); if (!d || d.stage === stage) return;
    const st = STAGES.find(s => s.id === stage);
    d.hist.push(["user", "Moved to " + st.name, 0]);
    d.hist.push(["auto", st.auto, 0]);
    if (stage === "visit") d.due = D(1, 10); if (stage === "quote") d.due = D(2); if (["won", "lost"].includes(stage)) d.due = null;
    d.stage = stage; render(); if (open === id) openPanel(id);
    toast(`${d.name} moved to ${st.name}. ${st.auto}.`);
  }
  function draft(d) {
    const f = d.name.split(" ")[0];
    return {
      new: `Hi ${f}, this is ${d.tech} from Cooper Air. I can come take a look at your ${d.job.toLowerCase()} today. Does 2pm or 4pm work better?`,
      contacted: `Hi ${f}, ${d.tech} from Cooper Air again. Just want to get you on the schedule for the ${d.job.toLowerCase()}. What day works this week?`,
      visit: `Hi ${f}, reminder that ${d.tech} will be at your home tomorrow at 9am for the estimate. Reply R to reschedule.`,
      quote: `Hi ${f}, checking in on the quote for your ${d.job.toLowerCase()}. Happy to walk through the options or the financing on a quick call. Any questions?`,
      won: `Hi ${f}, thanks for choosing Cooper Air. If ${d.tech} did a good job, a quick Google review helps us a lot: g.page/cooper-air-demo`,
      lost: `Hi ${f}, no worries on the ${d.job.toLowerCase()}. If anything changes, we're here, and our spring tune-up is $89 for past customers.`
    }[d.stage];
  }
  function openPanel(id) {
    const d = DEALS.find(x => x.id === id); open = id;
    $("panel").innerHTML = `<header><div><h2>${esc(d.name)}</h2><span class="muted">${esc(d.job)}</span></div><button class="btn sm" id="closeP" type="button">Close</button></header>
      <div class="sec"><dl class="kv"><dt>Deal value</dt><dd><b>${money(d.value)}</b></dd><dt>Stage</dt><dd><label class="sr" for="stageSel">Stage</label><select id="stageSel" class="input" style="height:30px">${STAGES.map(s => `<option value="${s.id}" ${s.id === d.stage ? "selected" : ""}>${s.name}</option>`).join("")}</select></dd>
        <dt>Phone</dt><dd>${esc(d.phone)}</dd><dt>ZIP</dt><dd>${esc(d.zip)}</dd><dt>Technician</dt><dd>${esc(d.tech)}</dd><dt>Source</dt><dd>${esc(d.src)}</dd><dt>Lead score</dt><dd>${d.score} / 100</dd>
        ${d.due ? `<dt>Next step</dt><dd>${dueTxt(d.due)}</dd>` : ""}${d.lost ? `<dt>Lost reason</dt><dd>${esc(d.lost)}</dd>` : ""}</dl></div>
      <div class="sec"><h3>Next text</h3><div class="draft" id="draft">${esc(draft(d))}</div><div class="note"><button class="btn sm primary" id="sendDraft" type="button">Send text</button><button class="btn sm" id="copyDraft" type="button">Copy</button></div></div>
      <div class="sec"><h3>History</h3><ul class="tl">${d.hist.slice().reverse().map(([k, t, when]) => `<li class="${k === "auto" ? "auto" : ""}"><span>${esc(t)}<small>${k === "auto" ? "Automation" : d.tech}, ${ago(when)}</small></span></li>`).join("")}</ul>
        <form class="note" id="noteForm"><label class="sr" for="noteIn">Add a note</label><input class="input" id="noteIn" placeholder="Add a note"><button class="btn sm">Add</button></form></div>`;
    $("panel").hidden = false;
    $("closeP").onclick = () => { $("panel").hidden = true; open = null; };
    $("stageSel").onchange = e => move(id, e.target.value);
    $("sendDraft").onclick = () => { d.hist.push(["user", "Text sent: " + draft(d), 0]); openPanel(id); toast("Text sent to " + d.phone + " (demo, nothing actually sent)."); };
    $("copyDraft").onclick = async () => { try { await navigator.clipboard.writeText(draft(d)); toast("Copied."); } catch (e) { const r = document.createRange(); r.selectNodeContents($("draft")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } };
    $("noteForm").onsubmit = e => { e.preventDefault(); const v = $("noteIn").value.trim(); if (!v) return; d.hist.push(["user", v, 0]); openPanel(id); };
  }

  // Drag and drop between columns (desktop); the stage menu in the panel covers touch and keyboard.
  let dragId = null;
  $("board").addEventListener("dragstart", e => { const c = e.target.closest(".card"); if (!c) return; dragId = +c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", c.dataset.id); } catch (err) {} });
  $("board").addEventListener("dragend", e => { const c = e.target.closest(".card"); if (c) c.classList.remove("dragging"); document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); });
  $("board").addEventListener("dragover", e => { const col = e.target.closest(".col"); if (!col) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over"); });
  $("board").addEventListener("drop", e => { const col = e.target.closest(".col"); if (!col || dragId == null) return; e.preventDefault(); move(dragId, col.dataset.stage); dragId = null; });
  $("board").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openPanel(+c.dataset.id); });
  ["q", "fTech", "fSrc"].forEach(id => $(id).addEventListener("input", render));
  document.addEventListener("keydown", e => { if (e.key === "Escape") { $("panel").hidden = true; open = null; } });
  render();
  window.__demo = { move, openPanel };
})();
</script>
</body>
</html>
